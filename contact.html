<form class="volunteer-form"
      action="https://formspree.io/f/yourID"
      method="POST">

  <label>Full Name (optional)</label>
  <input type="text" name="name">

  <label>Email Address (optional)</label>
  <input type="email" name="email">

  <label>What part of the ward are you in?</label>
  <input type="text" name="location" placeholder="e.g. White Oaks, Westmount">

  <label>What issue are you facing?</label>
  <textarea name="concern" rows="5" required></textarea>

  <label>How long has this been a problem?</label>
  <select name="duration">
    <option>Recently (last few weeks)</option>
    <option>A few months</option>
    <option>Over a year</option>
  </select>

  <label>How many people does this affect?</label>
  <select name="scale">
    <option>Just me</option>
    <option>A few people</option>
    <option>My neighborhood</option>
    <option>Large part of the ward</option>
  </select>

  <label>Category</label>
  <select name="category">
    <option>Housing</option>
    <option>Transit</option>
    <option>Public Safety</option>
    <option>Roads & Infrastructure</option>
    <option>Parks & Environment</option>
    <option>Other</option>
  </select>

  <label>How urgent is this issue?</label>
  <select name="urgency">
    <option>Not urgent</option>
    <option>Somewhat urgent</option>
    <option>Urgent</option>
  </select>

  <label>Have you reported this issue to the city before?</label>
  <select name="reported">
    <option>No</option>
    <option>Yes, but nothing changed</option>
    <option>Yes, and it was resolved</option>
  </select>

  <label>Can we follow up with you?</label>
  <select name="followup">
    <option>Yes</option>
    <option>No</option>
  </select>

  <button type="submit">Submit Concern</button>

</form>
