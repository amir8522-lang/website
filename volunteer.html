<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html">
      <span class="brand-mark">KA</span>
      <span>Kamrul Ahsan</span>

    <nav class="nav-links">

      <a class="pill" href="donate.html">Donate</a>
    </nav>
  </div>
</header>

<section class="volunteer-hero">

  <div class="container">
    <div class="volunteer-wrap">

      <div class="volunteer-panel">

        <h2>Join the Campaign</h2>
        <p>Be part of a grassroots effort to shape the future of Ward 7</p>

        <form class="volunteer-form" action="https://formspree.io/f/xrejdkdk" method="POST">

          <label>Full Name</label>
          <input type="text" name="name" required>

          <label>Email Address</label>
          <input type="email" name="email" required>

          <label>Phone Number</label>
          <input type="tel" name="phone">

          <label>What part of the ward do you live in?</label>
          <input type="text" name="location">

          <label>How would you like to help?</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="help" value="Door Knocking"> Door Knocking</label>
            <label><input type="checkbox" name="help" value="Phone Calls"> Phone Calls</label>
            <label><input type="checkbox" name="help" value="Events"> Events</label>
            <label><input type="checkbox" name="help" value="Outreach"> Community Outreach</label>
            <label><input type="checkbox" name="help" value="Logistics"> Lawn Signs</label>
          </div>

          <label>Availability</label>
          <select name="availability">
            <option>Weekday evenings</option>
            <option>Weekends</option>
            <option>Flexible</option>
          </select>

          <label>Anything you'd like us to add?</label>
          <textarea name="message"></textarea>

          <button type="submit">Join the Campaign</button>

        </form>

      </div>

    </div>
  </div>

</section>
